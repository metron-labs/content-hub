[project]
name = "Flare"
version = "2.2"
description = "Flare integration for Google SecOps. Connects Flare's threat exposure findings with Google SecOps so security teams can ingest dark-web, credential, and exposure alerts into SOAR cases and remediate directly from playbooks. Optional auto-remediation syncs closed SOAR Flare cases back to Flare using a timestamp checkpoint (no Google service account). In case of any queries, please reach out to support."
requires-python = ">=3.11,<3.12"
dependencies = [
 "flareio==2.4.1",
 "requests==2.34.2",
 "urllib3==2.7.0",
]

[dependency-groups]
dev = [
 "environmentcommon",
 "integration-testing",
 "pytest-json-report>=1.5.0",
 "pytest>=8.3.5",
 "soar-sdk",
 "tipcommon",
]

[tool.uv]
[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.uv.sources]
soar-sdk = { git = "https://github.com/chronicle/soar-sdk.git" }

[tool.uv.sources.integration-testing]
path = "../../../../../packages/integration_testing_whls/integration_testing-2.2.10-py3-none-any.whl"

[tool.uv.sources.tipcommon]
path = "../../../../../packages/tipcommon/whls/TIPCommon-2.2.10-py2.py3-none-any.whl"

[tool.uv.sources.environmentcommon]
path = "../../../../../packages/envcommon/whls/EnvironmentCommon-1.0.2-py2.py3-none-any.whl"
