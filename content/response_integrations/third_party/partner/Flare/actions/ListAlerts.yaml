name: List Alerts
description: "Retrieve the configured Flare alert rules. These are Flare alert rules, not SOAR alerts."
integration_identifier: Flare
parameters:
-   name: Max Records To Return
    default_value: "50"
    type: string
    description: "Maximum number of alert rules to return (1-1000). Default: 50."
    is_mandatory: false
-   name: Tenant ID
    default_value: ""
    type: string
    description: "Optional. Required only when the integration is configured with several tenant IDs; must be one of the configured IDs."
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/ListAlerts_JsonResult_example.json
    result_name: JsonResult
    show_result: true
default_result_value: ''
creator: Admin
script_result_name: is_success
