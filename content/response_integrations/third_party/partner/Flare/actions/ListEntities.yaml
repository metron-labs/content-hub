name: List Entities
description: "Search threat entities such as threat actors, malware families and ransomware groups."
integration_identifier: Flare
parameters:
-   name: Entity Type
    default_value: ""
    type: string
    description: "Optional entity type filter, e.g. threat_actor, malware, ransomware_group."
    is_mandatory: false
-   name: Query
    default_value: ""
    type: string
    description: "Optional free-text query."
    is_mandatory: false
-   name: Max Records To Return
    default_value: "50"
    type: string
    description: "Maximum number of entities to return (1-1000). Default: 50."
    is_mandatory: false
-   name: Tenant ID
    default_value: ""
    type: string
    description: "Optional. Required only when the integration is configured with several tenant IDs; must be one of the configured IDs."
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/ListEntities_JsonResult_example.json
    result_name: JsonResult
    show_result: true
default_result_value: ''
creator: Admin
script_result_name: is_success
