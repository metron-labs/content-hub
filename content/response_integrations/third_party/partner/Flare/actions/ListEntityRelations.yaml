name: List Entity Relations
description: "Retrieve relationships linked to a threat entity, such as related malware, infrastructure, or threat actors."
integration_identifier: Flare
parameters:
-   name: Entity ID
    default_value: ""
    type: string
    description: "ID of the threat entity."
    is_mandatory: true
-   name: Relation Types
    default_value: ""
    type: string
    description: "Optional comma-separated relation types to return. Empty returns every relation type."
    is_mandatory: false
-   name: Max Records To Return
    default_value: "50"
    type: string
    description: "Maximum number of relations to return (1-1000). Default: 50."
    is_mandatory: false
-   name: Tenant ID
    default_value: ""
    type: string
    description: "Optional. Required only when the integration is configured with several tenant IDs; must be one of the configured IDs."
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/ListEntityRelations_JsonResult_example.json
    result_name: JsonResult
    show_result: true
default_result_value: ''
creator: Admin
script_result_name: is_success
