name: Get Entity Details
description: "Retrieve the profile of a threat entity, including risk level, aliases and context."
integration_identifier: Flare
parameters:
-   name: Entity ID
    default_value: ""
    type: string
    description: "ID of the threat entity."
    is_mandatory: true
-   name: Tenant ID
    default_value: ""
    type: string
    description: "Optional. Required only when the integration is configured with several tenant IDs; must be one of the configured IDs."
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/GetEntityDetails_JsonResult_example.json
    result_name: JsonResult
    show_result: true
default_result_value: ''
creator: Admin
script_result_name: is_success
