name: Explain Identifier Match
description: "Explain why a Flare event matched a monitored identifier."
integration_identifier: Flare
parameters:
-   name: Event UID
    default_value: ""
    type: string
    description: "Flare event UID (metadata.uid)."
    is_mandatory: true
-   name: Identifier ID
    default_value: ""
    type: string
    description: "ID of the monitored identifier."
    is_mandatory: true
-   name: Tenant ID
    default_value: ""
    type: string
    description: "Optional. Required only when the integration is configured with several tenant IDs; must be one of the configured IDs."
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/ExplainIdentifierMatch_JsonResult_example.json
    result_name: JsonResult
    show_result: true
default_result_value: ''
creator: Admin
script_result_name: is_success
