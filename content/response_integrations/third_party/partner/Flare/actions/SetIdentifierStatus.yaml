name: Set Identifier Status
description: "Enable or disable monitoring for a Flare identifier. This changes monitoring in Flare."
integration_identifier: Flare
parameters:
-   name: Identifier ID
    default_value: ""
    type: string
    description: "ID of the identifier."
    is_mandatory: true
-   name: Enabled
    default_value: "true"
    type: boolean
    description: "Select to enable monitoring; clear to disable it."
    is_mandatory: false
-   name: Tenant ID
    default_value: ""
    type: string
    description: "Optional. Required only when the integration is configured with several tenant IDs; must be one of the configured IDs."
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/SetIdentifierStatus_JsonResult_example.json
    result_name: JsonResult
    show_result: true
default_result_value: ''
creator: Admin
script_result_name: is_success
