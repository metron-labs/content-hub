name: List Alert Channels
description: "Retrieve the configured Flare notification channels and destinations."
integration_identifier: Flare
parameters:
-   name: Channel Type
    default_value: ""
    type: string
    description: "Optional channel type filter, e.g. email, slack, webhook."
    is_mandatory: false
-   name: Tenant ID
    default_value: ""
    type: string
    description: "Optional. Required only when the integration is configured with several tenant IDs; must be one of the configured IDs."
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/ListAlertChannels_JsonResult_example.json
    result_name: JsonResult
    show_result: true
default_result_value: ''
creator: Admin
script_result_name: is_success
