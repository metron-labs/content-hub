name: Execute Credential Action
description: "Apply a lifecycle action to leaked credentials found in Flare events. This changes credential state in Flare."
integration_identifier: Flare
parameters:
-   name: Action Type
    default_value: ""
    type: string
    description: "Credential lifecycle action, for example remediate or ignore."
    is_mandatory: true
-   name: Credential IDs
    default_value: ""
    type: string
    description: "Comma-separated Flare credential IDs."
    is_mandatory: true
-   name: Tenant ID
    default_value: ""
    type: string
    description: "Optional. Required only when the integration is configured with several tenant IDs; must be one of the configured IDs."
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/ExecuteCredentialAction_JsonResult_example.json
    result_name: JsonResult
    show_result: true
default_result_value: ''
creator: Admin
script_result_name: is_success
