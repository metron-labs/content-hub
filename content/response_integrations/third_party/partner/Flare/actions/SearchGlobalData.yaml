name: Search Global Data
description: "Search Flare's global dataset (dark web forums, marketplaces, Telegram, ransomware blogs, stealer logs). Each search consumes Flare global search quota."
integration_identifier: Flare
parameters:
-   name: Query
    default_value: ""
    type: string
    description: "Search query."
    is_mandatory: true
-   name: Categories
    default_value: ""
    type: string
    description: "Optional comma-separated source categories to restrict the search."
    is_mandatory: false
-   name: From Date
    default_value: ""
    type: string
    description: "Optional start of the date range, ISO 8601 (e.g. 2026-01-01T00:00:00Z)."
    is_mandatory: false
-   name: To Date
    default_value: ""
    type: string
    description: "Optional end of the date range, ISO 8601 (e.g. 2026-01-31T00:00:00Z)."
    is_mandatory: false
-   name: Max Records To Return
    default_value: "50"
    type: string
    description: "Maximum number of results to return (1-1000). Default: 50."
    is_mandatory: false
-   name: Tenant ID
    default_value: ""
    type: string
    description: "Optional. Required only when the integration is configured with several tenant IDs; must be one of the configured IDs."
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/SearchGlobalData_JsonResult_example.json
    result_name: JsonResult
    show_result: true
default_result_value: ''
creator: Admin
script_result_name: is_success
