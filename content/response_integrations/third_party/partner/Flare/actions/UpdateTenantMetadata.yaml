name: Update Tenant Metadata
description: "Update the severity, tags, or notes stored on a Flare event. This changes the event in Flare. Provide at least one of Severity, Tags, or Notes."
integration_identifier: Flare
parameters:
-   name: Event UID
    default_value: ""
    type: string
    description: "Flare event UID (metadata.uid)."
    is_mandatory: true
-   name: Severity
    default_value: ""
    type: string
    description: "Optional severity: info, low, medium, high, or critical."
    is_mandatory: false
-   name: Tags
    default_value: ""
    type: string
    description: "Optional comma-separated tags. Replaces the event tags when set."
    is_mandatory: false
-   name: Notes
    default_value: ""
    type: string
    description: "Optional internal note attached to the event."
    is_mandatory: false
-   name: Tenant ID
    default_value: ""
    type: string
    description: "Optional. Required only when the integration is configured with several tenant IDs; must be one of the configured IDs."
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/UpdateTenantMetadata_JsonResult_example.json
    result_name: JsonResult
    show_result: true
default_result_value: ''
creator: Admin
script_result_name: is_success
