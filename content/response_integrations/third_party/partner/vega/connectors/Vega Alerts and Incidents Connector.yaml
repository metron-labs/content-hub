name: Vega Alerts and Incidents Connector
parameters:
-   name: API Root
    default_value: https://api.vega.io
    type: url
    description: The Base URL of the Vega API, for example https://api.vega.io. Invalid
        values cause a configuration error.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Access Key ID
    default_value: ''
    type: password
    description: Vega Access Key ID (X-Vega-Key-Id header). Invalid values cause a
        configuration error.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Access Key
    default_value: ''
    type: password
    description: Vega Access Key used with login_machine. Invalid values cause a configuration
        error.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Vega Entities to Fetch
    default_value: Alerts,Incidents
    type: string
    description: 'Possible Values: Alerts, Incidents (singular Alert or Incident is
        also accepted). Combined with Has Related Incidents: Incidents+Alerts nests
        related alerts inside the Vega Incident case and creates separate cases for
        unrelated alerts when No is selected. Incidents only creates Vega Incident
        cases (no related or unrelated alerts). Alerts only creates one case per
        Vega alert. At least one is required. Unsupported values cause a configuration
        error.'
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Fetch Lookback (Minutes)
    default_value: '5'
    type: string
    description: Minutes to shift the query window backwards to catch late-indexed
        records. Enter an integer from 1 to 60. Invalid values cause a configuration
        error.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Max Days Backwards
    default_value: '130'
    type: string
    description: Days to backfill on the first run only. Enter an integer from 0 to
        365 (0 starts from today). Invalid values cause a configuration error.
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Alert Severities to Fetch
    default_value: LOW,MEDIUM,HIGH,CRITICAL
    type: string
    description: 'Possible Values: LOW, MEDIUM, HIGH, CRITICAL. Empty = all. Unsupported
        values cause a configuration error.'
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Alert Statuses to Fetch
    default_value: OPEN,IN PROGRESS,PEER REVIEW,RESOLVED
    type: string
    description: 'Possible Values: OPEN, IN PROGRESS, PEER REVIEW, RESOLVED. Empty
        = all. Unsupported values cause a configuration error.'
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Alert Verdicts to Fetch
    default_value: MALICIOUS,SUSPICIOUS,BENIGN,INCONCLUSIVE,NA
    type: string
    description: 'Possible Values: MALICIOUS, SUSPICIOUS, BENIGN, INCONCLUSIVE, NA.
        Empty = all. Unsupported values cause a configuration error.'
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Has Related Incidents
    default_value: Yes,No
    type: string
    description: 'Possible Values: Yes, No. Applies when Alerts are selected. Yes
        loads related Vega alerts: nested inside the incident case when Incidents
        is also selected, or as their own cases when only Alerts is selected. No
        loads unrelated Vega alerts as one SOAR case each and does not nest related
        alerts inside incident cases. Select both to run both flows. At least one
        is required. Unsupported values cause a configuration error.'
    is_mandatory: true
    is_advanced: false
    mode: script
-   name: Incident Severities to Fetch
    default_value: LOW,MEDIUM,HIGH,CRITICAL
    type: string
    description: 'Possible Values: LOW, MEDIUM, HIGH, CRITICAL. Empty = all. Unsupported
        values cause a configuration error.'
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Incident Statuses to Fetch
    default_value: NEW,INVESTIGATING,ON HOLD,EXTERNAL ESCALATION,RESOLVED,REOPENED,REVIEW
        RECOMMENDED,RESPONSE REQUIRED,UNDER REVIEW
    type: string
    description: 'Possible Values: NEW, INVESTIGATING, ON HOLD, EXTERNAL ESCALATION,
        RESOLVED, REOPENED, REVIEW RECOMMENDED, RESPONSE REQUIRED, UNDER REVIEW. Empty
        = all. Unsupported values cause a configuration error.'
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Incident Verdicts to Fetch
    default_value: MALICIOUS,SUSPICIOUS,BENIGN,INCONCLUSIVE,NA
    type: string
    description: 'Possible Values: MALICIOUS, SUSPICIOUS, BENIGN, INCONCLUSIVE, NA.
        Empty = all. Unsupported values cause a configuration error.'
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: Sync Case Close to Vega
    default_value: 'true'
    type: boolean
    description: When true, close the matching Vega incident (and its related alerts)
        or standalone Vega alert when the SOAR case is closed.
    is_mandatory: false
    is_advanced: true
    mode: script
-   name: DeviceProductField
    default_value: product
    type: string
    description: Platform Product Field Name (required by SecOps).
    is_mandatory: true
    is_advanced: false
    mode: regular
-   name: EventClassId
    default_value: event_class_id
    type: string
    description: Platform Event Field Name (required by SecOps).
    is_mandatory: true
    is_advanced: false
    mode: regular
-   name: PythonProcessTimeout
    default_value: '930'
    type: string
    description: Max seconds for one connector run before SecOps kills the Python
        process. This is not the schedule. Use Run Every to control how often a run
        starts. Raise this if a full time-window fetch is killed before it finishes.
    is_mandatory: true
    is_advanced: false
    mode: regular
description: 'Pull Vega incidents as SOAR cases named Vega Incident - <display
    id> - <name>. When Alerts and Has Related Incidents=Yes are also selected,
    related Vega alerts are created as alerts on that same case. The first case
    has 1 Vega incident alert plus up to 89 related alerts (each with Vega alert
    events). Extra related alerts go to overflow cases of up to 90 related alerts
    each (the incident alert is not copied). Related alerts keep their own Name
    (Vega Alert - id - name). They share Product Vega, grouping id, and Rule
    Generator (the incident case title). Add an Alerts Grouping rule for Product
    Vega, Group By Source Grouping Identifier (same pattern as Wiz_Defend), above
    All alerts. Without that rule SOAR creates one case per Vega alert. Set Case
    Name to Rule Generator. Dynamic List is not used. Set Run Every to 5 minutes
    unless the tenant requires otherwise.'
integration: Vega
documentation_link: https://vega.io/
rules: []
is_connector_rules_supported: false
creator: admin
