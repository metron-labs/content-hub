name: Get Alert Events
description: Fetch aggregated alert events for a Vega alert. When Alert ID is omitted,
    uses vega_id from the current alert.
integration_identifier: Vega
parameters:
-   name: Alert ID
    default_value: ''
    type: playbook_name
    description: Vega alert UUID. Optional when running on a Vega alert.
    is_mandatory: false
-   name: Limit
    default_value: '200'
    type: playbook_name
    description: Page size.
    is_mandatory: false
-   name: Offset
    default_value: '0'
    type: playbook_name
    description: Pagination offset.
    is_mandatory: false
dynamic_results_metadata:
-   result_example_path: resources/get_alert_events_JsonResult_example.json
    result_name: JsonResult
    show_result: true
default_result_value: ''
creator: admin
script_result_name: ScriptResult
